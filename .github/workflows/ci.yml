name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (syntax + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lightweight subset: the tests replace the embedding model and Ollama
      # with fakes, so torch / sentence-transformers / unstructured are not needed.
      - name: Install test dependencies
        run: >
          pip install pytest httpx numpy
          fastapi==0.128.5 python-multipart==0.0.21 pydantic==2.12.5
          chromadb==1.4.1 PyMuPDF==1.26.7 pillow==12.1.0 pytesseract==0.3.13
          langdetect==1.0.9 requests==2.32.5
          langchain-core==1.8.0 langchain-ollama==1.1.0 langchain-chroma==1.1.0 langgraph==1.2.22

      - name: Syntax check
        run: python -m compileall -q backend

      - name: Run unit tests
        run: pytest